[Actions]
# GZreader (Grimmory + ZenOS + KOReader). Launchpad shortcuts: press Shift, then the two keys.
# Shift G G: open GZreader on the last book
G G = !/mnt/us/koreader/koreader.sh
# Shift G L: open GZreader in the library
G L = !/mnt/us/koreader/koreader.sh /mnt/us/documents
# Shift G N: open GZreader without the Kindle framework (more memory)
G N = !/mnt/us/koreader/koreader.sh --framework_stop
# Original KOReader shortcuts, kept for muscle memory
P D = !/mnt/us/koreader/koreader.sh /mnt/us/documents
P P = !/mnt/us/koreader/koreader.sh
P K = !/mnt/us/koreader/koreader.sh --framework_stop /mnt/us/documents
P L = !/mnt/us/koreader/koreader.sh --framework_stop
# restart amazon framework - when it got irritated
P R = !/etc/init.d/framework restart
