# Builds GZreader for every published release and attaches the packages:
#   gzreader-kindle-legacy-<version>.zip   full install: Kindle 2, DX, Kindle Keyboard
#   gzreader-kindle-<version>.zip          full install: Kindle 4, Kindle Touch
#   gzreader-kindlehf-<version>.zip        full install: touch Kindles on firmware
#                                          5.16.3+ (Paperwhite 3 / 7th gen and later)
#   gzreader-kindlepw2-<version>.zip       full install: touch Kindles on firmware
#                                          5.6.1 – 5.16.2
#   gzreader-update.zip                    what Kindles download to update (Lua only,
#                                          the same for all of them)
# Kindles also update from a release without these (they fall back to the
# release's source code zip); attaching them keeps the download small.
name: GZreader release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v1.0.3"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      KOREADER_TAG: v2026.07.1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Tools
        # qemu + ARM libc: run the Kindle's own LuaJIT to precompile bytecode
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dictzip rsync zip qemu-user-static libc6-armel-cross libgcc-s1-armel-cross libc6-armhf-cross libgcc-s1-armhf-cross
      - name: Official KOReader Kindle releases (native binaries)
        run: |
          for p in kindle-legacy kindle kindlehf kindlepw2; do
            gh release download "$KOREADER_TAG" --repo koreader/koreader --pattern "koreader-$p-v*.zip" --dir dl
          done
          ls -la dl
      - name: Package
        run: |
          VERSION="${TAG#v}"; VERSION="${VERSION#.}"
          # (the update package is the same from each: keep the legacy one's)
          for p in kindlehf kindlepw2 kindle kindle-legacy; do
            GZ_VERSION="$VERSION" tools/gzreader/package-kindle.sh dl/koreader-$p-v*.zip out
          done
      - name: Attach to the release
        run: gh release upload "$TAG" out/gzreader-kindle-legacy-*.zip out/gzreader-kindle-[0-9]*.zip out/gzreader-kindlehf-*.zip out/gzreader-kindlepw2-*.zip out/gzreader-update.zip --clobber
      - name: The update for the sync page (Kindles without Wi-Fi)
        # A web page can't read GitHub's release downloads (no CORS), but it
        # can read raw.githubusercontent.com: the update and latest.json go
        # on the "updates" branch, one commit replaced at every release (so
        # the repository doesn't grow). Only for the latest release.
        continue-on-error: true
        run: |
          VERSION="${TAG#v}"; VERSION="${VERSION#.}"
          LATEST=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          if [ "$LATEST" != "$TAG" ]; then echo "not the latest release ($LATEST): updates branch left as it is"; exit 0; fi
          mkdir -p upd && cp out/gzreader-update.zip upd/
          SIZE=$(stat -c %s upd/gzreader-update.zip)
          SHA=$(sha256sum upd/gzreader-update.zip | cut -d' ' -f1)
          printf '{"version":"%s","size":%s,"sha256":"%s","file":"gzreader-update.zip"}\n' "$VERSION" "$SIZE" "$SHA" > upd/latest.json
          cd upd
          git init -q -b updates
          git add gzreader-update.zip latest.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "GZreader $VERSION update"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" updates
      - name: Nook 1st Edition (test build)
        # the Kindle 2/3/DX package + Debian wheezy's glibc and BusyBox (the
        # Nook's Android has no glibc) + the Nook's start script; a failure
        # here doesn't hold up the Kindle packages above
        continue-on-error: true
        run: |
          VERSION="${TAG#v}"; VERSION="${VERSION#.}"
          tools/gzreader/nook-runtime.sh nook-runtime
          GZ_VERSION="$VERSION" tools/gzreader/package-nook.sh out/gzreader-kindle-legacy-"$VERSION".zip nook-runtime out
          gh release upload "$TAG" out/gzreader-nook-*.zip --clobber
