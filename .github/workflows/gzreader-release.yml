# Builds GZreader for every published release and attaches the packages:
#   gzreader-kindle-legacy-<version>.zip   full install (copy to the Kindle)
#   gzreader-update.zip                    what Kindles download to update
# Kindles also update from a release without these (they fall back to the
# release's source code zip); attaching them keeps the download small.
name: GZreader release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v1.0.3"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      KOREADER_TAG: v2026.07.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dictzip rsync zip
      - name: Official KOReader kindle-legacy release (native binaries)
        run: |
          gh release download "$KOREADER_TAG" --repo koreader/koreader --pattern '*kindle-legacy*.zip' --dir dl
          ls -la dl
      - name: Package
        run: |
          VERSION="${TAG#v}"; VERSION="${VERSION#.}"
          GZ_VERSION="$VERSION" tools/grimmory/package-kindle-legacy.sh dl/*kindle-legacy*.zip out
      - name: Attach to the release
        run: gh release upload "$TAG" out/gzreader-kindle-legacy-*.zip out/gzreader-update.zip --clobber
