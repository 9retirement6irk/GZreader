[Actions]
# GZreader (Grimmory + ZenOS + KOReader), in its own folder (GZreader/app).
# Launchpad shortcuts: press Shift, then the two keys.
# Shift G G: open GZreader on the last book
G G = !/mnt/us/GZreader/app/koreader.sh
# Shift G L: open GZreader in the library
G L = !/mnt/us/GZreader/app/koreader.sh /mnt/us/GZreader/books
# Shift G N: open GZreader without the Kindle framework (more memory)
G N = !/mnt/us/GZreader/app/koreader.sh --framework_stop
