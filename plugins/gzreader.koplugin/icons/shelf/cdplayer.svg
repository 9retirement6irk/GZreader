<rect x="16" y="78" width="7" height="13" rx="1.5" fill="#2a2a2a" transform="rotate(25 19 84)"/>
<rect x="146" y="34" width="7" height="13" rx="1.5" fill="#2a2a2a" transform="rotate(-55 149 40)"/>
