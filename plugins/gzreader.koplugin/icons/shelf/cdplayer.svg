<svg xmlns="http://www.w3.org/2000/svg" width="170" height="104" viewBox="0 0 170 104">
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9c9c9c"/><stop offset="1" stop-color="#4e4e4e"/></linearGradient>
<radialGradient id="top" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#ededed"/><stop offset=".6" stop-color="#c4c4c4"/><stop offset="1" stop-color="#9a9a9a"/></radialGradient>
<radialGradient id="lid" cx=".42" cy=".35" r=".7"><stop offset="0" stop-color="#e2e2e2"/><stop offset="1" stop-color="#a8a8a8"/></radialGradient>
<radialGradient id="foam" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#d4d4d4"/><stop offset=".7" stop-color="#a6a6a6"/><stop offset="1" stop-color="#7c7c7c"/></radialGradient>
</defs>
<!-- the player lying flat on the shelf, seen from the front and a little above: its edge
     (the bottom of the picture is where it rests), its top, its lid -->
<ellipse cx="85" cy="81" rx="74" ry="22" fill="url(#edge)" stroke="#222"/>
<rect x="11" y="72" width="148" height="9" fill="url(#edge)"/>
<path d="M11 72 V81 M159 72 V81" stroke="#222" stroke-width="1"/>
<ellipse cx="85" cy="72" rx="74" ry="22" fill="url(#top)" stroke="#333"/>
<ellipse cx="80" cy="69" rx="55" ry="15" fill="url(#lid)" stroke="#6a6a6a"/>
<path d="M42 64 A50 13 0 0 1 104 56" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".8"/>
<!-- the front: a small display and buttons on the rim -->
<rect x="74" y="88" width="24" height="9" rx="1.5" fill="#3a3a3a" stroke="#222"/>
<rect x="77" y="90" width="18" height="5" rx="1" fill="#8e8e8e"/>
<ellipse cx="55" cy="91" rx="5" ry="3" fill="#d8d8d8" stroke="#555"/>
<ellipse cx="117" cy="90" rx="6" ry="3.5" fill="#d8d8d8" stroke="#555"/>
<path d="M115 90 l4 -2 v4 z" fill="#555"/>
<ellipse cx="136" cy="85" rx="3.5" ry="2.5" fill="#d8d8d8" stroke="#555"/>
<!-- the headphones resting on it: the band standing up behind, a pad on the lid at each end -->
<path d="M34 64 C30 14 136 8 140 58" fill="none" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round"/>
<rect x="30" y="52" width="7" height="12" rx="1.5" fill="#2a2a2a"/>
<rect x="136" y="47" width="7" height="12" rx="1.5" fill="#2a2a2a"/>
<ellipse cx="34" cy="68" rx="16" ry="8" fill="url(#foam)" stroke="#555"/>
<ellipse cx="34" cy="67" rx="9" ry="4.5" fill="none" stroke="#9a9a9a" stroke-width=".8"/>
<ellipse cx="140" cy="63" rx="16" ry="8" fill="url(#foam)" stroke="#555"/>
<ellipse cx="140" cy="62" rx="9" ry="4.5" fill="none" stroke="#9a9a9a" stroke-width=".8"/>
<g fill="#8a8a8a"><circle cx="27" cy="66" r="1"/><circle cx="40" cy="65" r="1"/><circle cx="42" cy="70" r="1"/><circle cx="28" cy="71" r="1"/><circle cx="133" cy="61" r="1"/><circle cx="146" cy="60" r="1"/><circle cx="148" cy="65" r="1"/><circle cx="134" cy="66" r="1"/></g>
<!-- the cord, from the right pad over the edge into the jack -->
<path d="M150 68 C160 74 158 84 146 88" fill="none" stroke="#1e1e1e" stroke-width="1.6"/>
<circle cx="145" cy="88" r="1.8" fill="#1e1e1e"/>
</svg>
