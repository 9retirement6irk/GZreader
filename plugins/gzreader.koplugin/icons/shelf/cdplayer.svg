<rect x="86" y="88" width="26" height="13" rx="2" fill="#3a3a3a" stroke="#222" transform="rotate(-6 99 94)"/>
<rect x="89" y="91" width="20" height="7" rx="1" fill="#8e8e8e" transform="rotate(-6 99 94)"/>
<circle cx="70" cy="96" r="5" fill="#d8d8d8" stroke="#555"/>
