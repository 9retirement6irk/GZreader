<ellipse cx="28" cy="98" rx="9" ry="7" fill="none" stroke="#9a9a9a" stroke-width=".8"/>
<ellipse cx="152" cy="50" rx="15" ry="12" fill="url(#foam)" stroke="#555"/>
<ellipse cx="152" cy="50" rx="9" ry="7" fill="none" stroke="#9a9a9a" stroke-width=".8"/>
<g fill="#8a8a8a"><circle cx="22" cy="94" r="1"/><circle cx="32" cy="92" r="1"/><circle cx="35" cy="101" r="1"/><circle cx="24" cy="104" r="1"/><circle cx="146" cy="46" r="1"/><circle cx="156" cy="44" r="1"/><circle cx="159" cy="53" r="1"/><circle cx="148" cy="56" r="1"/></g>
