<svg xmlns="http://www.w3.org/2000/svg" width="130" height="160" viewBox="0 0 130 160">
<defs>
<linearGradient id="front" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3a3a"/><stop offset=".3" stop-color="#5c5c5c"/><stop offset="1" stop-color="#454545"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bdbdbd"/><stop offset=".5" stop-color="#f0f0f0"/><stop offset="1" stop-color="#9a9a9a"/></linearGradient>
<linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6e6e6"/><stop offset="1" stop-color="#9c9c9c"/></linearGradient>
<radialGradient id="foam" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#8a8a8a"/><stop offset=".7" stop-color="#5a5a5a"/><stop offset="1" stop-color="#3c3c3c"/></radialGradient>
</defs>
<!-- the player -->
<rect x="4" y="66" width="74" height="92" rx="3" fill="url(#front)" stroke="#111" stroke-width="1.5"/>
<rect x="64" y="66" width="14" height="92" rx="2" fill="url(#silver)" stroke="#222"/>
<rect x="4" y="142" width="60" height="16" rx="2" fill="url(#silver)" stroke="#222"/>
<rect x="10" y="60" width="9" height="7" rx="1.5" fill="#d0d0d0" stroke="#333"/>
<rect x="36" y="59" width="6" height="8" rx="1" fill="#2a2a2a"/>
<rect x="66" y="80" width="10" height="5" rx="1" fill="#8a8a8a"/><rect x="66" y="90" width="10" height="5" rx="1" fill="#8a8a8a"/><rect x="66" y="100" width="10" height="5" rx="1" fill="#8a8a8a"/>
