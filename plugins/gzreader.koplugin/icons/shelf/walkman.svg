<path d="M84 74 C80 10 126 6 125 56" fill="none" stroke="#7a7a7a" stroke-width="5" stroke-linecap="round"/>
<path d="M84 74 C80 12 126 8 125 56" fill="none" stroke="#e8e8e8" stroke-width="1.5"/>
